# ==============================================================================
# Project: DocNova: AI PDF & Scanner
# Package: com.novastudio24.docnova
# Component: Master CI/CD Pipeline (Direct APK Auto-Publisher via GitHub Release)
# ==============================================================================

name: DocNova Engine & Android APK Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify-all:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি চেকআউট
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. নেটিভ সিস্টেম ডিপেন্ডেন্সি ইনস্টল (C++ & OpenCV)
      - name: Install Native System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libopencv-dev tesseract-ocr libtesseract-dev

      # ৩. মডিউল ১: C++ ভিশন কোর কম্পাইল ও ভ্যালিডেশন
      - name: Build & Test C++ Vision Engine (core-cv)
        run: |
          cd core-cv
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)
          ./docnova_cv_cli
          cp scanned_warp.jpg ../../ai-pipeline/scanned_warp.jpg

      # ৪. পাইথন এনভায়রনমেন্ট সেটআপ
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ৫. মডিউল ২: Python AI ডিকম্পোজিশন ইঞ্জিন ভ্যালিডেশন
      - name: Run Python AI Layout Engine
        run: |
          cd ai-pipeline
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python layout_engine.py
          cp document_structure.json ../pdf-engine/document_structure.json

      # ৬. রাস্ট (Rust) এনভায়রনমেন্ট সেটআপ
      - name: Set up Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      # ৭. মডিউল ৩: Rust ভেক্টর PDF সিন্থেসাইজার রান
      - name: Run Rust Vector PDF Synthesizer
        run: |
          cd pdf-engine
          cargo build --release
          cargo run --release

      # ৮. জাভা ১৭ সেটআপ (অ্যান্ড্রয়েড বিল্ডের জন্য)
      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৯. ফ্লাটার (Flutter) SDK সেটআপ
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ১০. অ্যান্ড্রয়েড গ্র্যাডল স্ক্যাফোল্ডিং ও APK বিল্ড
      - name: Build Android Release APK
        run: |
          flutter create scaffold_app --org com.novastudio24 --project-name docnova
          cp -rn scaffold_app/android app/ || true
          cd app
          flutter pub get
          flutter build apk --release
          # সরাসরি ব্যবহারের জন্য APK কপি ও রিনেম
          cp build/app/outputs/flutter-apk/app-release.apk ../DocNova.apk

      # ১১. কোনো জিপ ছাড়া সরাসরি DocNova.apk রিলিজ হিসেবে পাবলিশ
      - name: Publish Direct Unzipped DocNova.apk
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DocNova: AI PDF & Scanner (Latest APK)"
          body: "এই ফাইলটি সরাসরি ডাউনলোড করে মোবাইলে ইনস্টল করতে পারবেন (কোনো আনজিপ করার প্রয়োজন নেই)।"
          files: DocNova.apk
