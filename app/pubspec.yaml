name: docnova
description: "DocNova: AI PDF & Scanner - Enterprise Mobile Client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI ও আইকন
  cupertino_icons: ^1.0.6

  # ১. ক্যামেরা ফিড
  camera: ^0.10.5+9

  # ২. লাইভ হাই-স্পিড QR ও বারকোড স্ক্যানার ইঞ্জিন (ক্যামেরা ফ্রেম ডিকোডার)
  mobile_scanner: ^5.2.3

  # ৩. কাস্টম QR কোড জেনারেটর ইঞ্জিন
  qr_flutter: ^4.1.0

  # ৪. কাস্টম বারকোড জেনারেটর (Code 128, EAN, UPC ইত্যাদি)
  barcode_widget: ^2.0.4

  # ৫. ইমেজ প্রসেসিং কোর (হাত/টেবিল ক্রপিং, ম্যাজিক কালার ফিল্টার ও ব্যাকগ্রাউন্ড ক্লিনিং)
  image: ^4.2.0

  # ৬. ফুল-ফিচার্ড PDF জেনারেটর ইঞ্জিন (খাঁটি ভেক্টর ও পেজ ম্যানেজার)
  pdf: ^3.10.8

  # ৭. ডিভাইস স্টোরেজ ও ফাইল পাথ হ্যান্ডলার
  path_provider: ^2.1.2

  # ৮. তৈরি হওয়া PDF এবং ইমেজ সরাসরি শেয়ার ও ডাউনলোড
  share_plus: ^7.2.2

  # ৯. রানটাইম ক্যামেরা ও মেমোরি পারমিশন
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
